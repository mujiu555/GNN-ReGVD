# GNN-ReGVD default configuration
# Usage: python run.py --config configs/default.yaml --do_train --do_test

# Model
model_type: roberta
model_name_or_path: microsoft/codebert-base
tokenizer_name: microsoft/codebert-base
model: GNNs
block_size: 400

# GNN architecture
gnn: ReGCN
hidden_size: 256
feature_dim_size: 768
num_GNN_layers: 2
num_classes: 2
format: uni
window_size: 3
att_op: mul
remove_residual: false

# Training
train_batch_size: 16
eval_batch_size: 16
gradient_accumulation_steps: 1
learning_rate: 0.0005
weight_decay: 0.0
adam_epsilon: 0.00000001
max_grad_norm: 1.0
epoch: 100
seed: 42

# Data
train_data_file: ../dataset/train.jsonl
eval_data_file: ../dataset/valid.jsonl
test_data_file: ../dataset/test.jsonl
training_percent: 1.0

# Mixed precision
fp16: false
